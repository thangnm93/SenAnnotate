<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>All-mode fixture</title>

      body { margin: 40px; font: 14px/1.6 system-ui, sans-serif; }

  <body>
    <div id="box">Click target</div>

</html>
